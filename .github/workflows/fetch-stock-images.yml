name: Fetch stock image candidates

# Downloads openly-licensed (commercial-use) photo candidates from Wikimedia Commons
# into stock-candidates/ so they can be reviewed and curated for the website.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Pipe-separated search terms"
        required: true
      per_query:
        description: "Candidates per term"
        default: "6"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidates
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          PER: ${{ github.event.inputs.per_query }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse
          UA = {"User-Agent": "KavitasArtistrySite/1.0 (https://kavita1.vercel.app; stock image curation)"}
          OK = ("cc0", "cc-by", "cc by", "public domain", "pd")
          out = "stock-candidates"; os.makedirs(out, exist_ok=True)
          credits = []
          for q in os.environ["QUERIES"].split("|"):
              q = q.strip()
              if not q: continue
              slug = re.sub(r"[^a-z0-9]+", "-", q.lower()).strip("-")
              params = {"action": "query", "format": "json", "generator": "search", "gsrsearch": q + " filetype:bitmap", "gsrnamespace": 6, "gsrlimit": 30,
                        "prop": "imageinfo", "iiprop": "url|size|extmetadata|mime", "iiurlwidth": 1600}
              try:
                  data = json.load(urllib.request.urlopen(urllib.request.Request("https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode(params), headers=UA), timeout=30))
              except Exception as e:
                  print("search failed", q, e); continue
              pages = sorted((data.get("query") or {}).get("pages", {}).values(), key=lambda p: p.get("index", 99))
              n = 0
              for pg in pages:
                  if n >= int(os.environ.get("PER", "6")): break
                  ii = (pg.get("imageinfo") or [{}])[0]
                  meta = ii.get("extmetadata") or {}
                  lic = (meta.get("LicenseShortName", {}).get("value") or "").lower()
                  if not any(k in lic for k in OK) or "nc" in lic.split("-") or "nd" in lic.split("-"): continue
                  if (ii.get("width") or 0) < 1000 or ii.get("mime") not in ("image/jpeg", "image/png", "image/webp"): continue
                  src = ii.get("thumburl") or ii.get("url")
                  name = f"{slug}-{n+1}.jpg"
                  try:
                      blob = urllib.request.urlopen(urllib.request.Request(src, headers=UA), timeout=60).read()
                      if len(blob) < 40_000: continue
                      open(f"{out}/{name}", "wb").write(blob)
                  except Exception as e:
                      print("download failed", src, e); continue
                  strip = lambda v: re.sub(r"<[^>]+>", "", v or "").strip()
                  credits.append({"file": name, "query": q, "title": pg.get("title"), "creator": strip(meta.get("Artist", {}).get("value")),
                                  "license": meta.get("LicenseShortName", {}).get("value"), "license_url": meta.get("LicenseUrl", {}).get("value"),
                                  "source": ii.get("descriptionurl"), "description": strip(meta.get("ImageDescription", {}).get("value"))[:300]})
                  n += 1
                  time.sleep(0.5)
              print(q, "->", n)
              time.sleep(1)
          json.dump(credits, open(f"{out}/credits.json", "w"), indent=1)
          PY
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-candidates
          git commit -m "Add stock image candidates for review [skip ci]" || echo "nothing to commit"
          git push
