name: Fetch stock image candidates

# Downloads openly-licensed (commercial-use) photo candidates from Openverse
# into stock-candidates/ so they can be reviewed and curated for the website.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Pipe-separated search terms"
        required: true
      per_query:
        description: "Candidates per term"
        default: "6"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidates
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          PER: ${{ github.event.inputs.per_query }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          out = "stock-candidates"; os.makedirs(out, exist_ok=True)
          credits = []
          for q in os.environ["QUERIES"].split("|"):
              q = q.strip()
              if not q: continue
              slug = re.sub(r"[^a-z0-9]+", "-", q.lower()).strip("-")
              url = "https://api.openverse.org/v1/images/?" + urllib.parse.urlencode({"q": q, "license_type": "commercial", "page_size": 40, "mature": "false"})
              req = urllib.request.Request(url, headers={"User-Agent": "kavitas-artistry-site/1.0"})
              try:
                  results = json.load(urllib.request.urlopen(req, timeout=30)).get("results", [])
              except Exception as e:
                  print("search failed", q, e); continue
              n = 0
              for r in results:
                  if n >= int(os.environ.get("PER", "6")): break
                  if (r.get("width") or 0) < 900: continue
                  src = r.get("url")
                  ext = (r.get("filetype") or "jpg").lower()
                  if ext not in ("jpg", "jpeg", "png", "webp"): continue
                  name = f"{slug}-{n+1}.{ext}"
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(src, headers={"User-Agent": "kavitas-artistry-site/1.0"}), timeout=60).read()
                      if len(data) > 12_000_000 or len(data) < 30_000: continue
                      open(f"{out}/{name}", "wb").write(data)
                  except Exception as e:
                      print("download failed", src, e); continue
                  credits.append({"file": name, "query": q, "title": r.get("title"), "creator": r.get("creator"), "license": r.get("license"), "license_version": r.get("license_version"), "license_url": r.get("license_url"), "source": r.get("foreign_landing_url"), "provider": r.get("provider")})
                  n += 1
              print(q, "->", n)
          json.dump(credits, open(f"{out}/credits.json", "w"), indent=1)
          PY
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-candidates
          git commit -m "Add stock image candidates for review [skip ci]" || echo "nothing to commit"
          git push
